[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-ai"
version = "0.1.0"
description = "AI-powered photo and video analysis, story timeline planning, and open-source programmatic video rendering tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16.0",
    "numpy>=1.24",
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-editor = "video_editing_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_editing_ai = ["web/static/*"]
