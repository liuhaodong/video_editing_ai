[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-ai"
version = "0.1.0"
description = "AI-powered photo and video analysis, story timeline planning, and open-source programmatic video rendering tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16.0",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy>=1.24,<2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python>=4.8,<4.12; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python>=4.8; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy>=1.11,<1.15; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scipy>=1.11; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scikit-learn>=1.3,<1.7; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scikit-learn>=1.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.40,<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.40; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "huggingface-hub>=0.23,<1.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "huggingface-hub>=0.23; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
    "sentence-transformers>=2.7,<3.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=2.7.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "onnxruntime>=1.16.0",
    "av>=11.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
ai-editor = "video_editing_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_editing_ai = ["web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
